name: Build Cradlewell Baby Tracker

on:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build Android (Play Store)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Expo SDK 58 / React Native 0.88 and current eas-cli need Node >= 22.13
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          # Pinned so a new eas-cli release can't silently break the build
          eas-version: 27.11.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android AAB
        run: eas build --platform android --profile production --non-interactive
